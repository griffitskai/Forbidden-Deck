name: Wire Act III balance

on:
  push:
    paths:
      - '.github/workflows/wire-act3-balance.yml'

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wire balance module and bump displayed version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          if 'js/12-act3-balance.js' not in s:
              s=s.replace('<script src="js/11-act3.js"></script>', '<script src="js/11-act3.js"></script>\n<script src="js/12-act3-balance.js"></script>')
          s=s.replace('Forbidden Deck — V0.8','Forbidden Deck — V0.9')
          s=s.replace('FORBIDDEN DECK <small>V0.8</small>','FORBIDDEN DECK <small>V0.9</small>')
          s=s.replace('V0.8 — nowa mapa, dwa akty i dalsza progresja.','V0.9 — trzy akty, zapis runu i balans Cytadeli Popiołu.')
          p.write_text(s)
          PY
      - name: Commit wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Wire Act III balance module and mark V0.9 (#10)"
          git push
