name: Wire persistence UI

on:
  push:
    paths:
      - .github/workflows/wire-persistence.yml

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add continue button and persistence module
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if 'id="continueRunBtn"' not in s:
              s=s.replace('<button class="btn" id="equipBtn">Ekwipunek</button>', '<button class="btn" id="continueRunBtn" hidden>▶ Kontynuuj run</button>\n      <button class="btn" id="equipBtn">Ekwipunek</button>')
          if 'js/10-persistence.js' not in s:
              s=s.replace('<script src="js/07-effects.js"></script>', '<script src="js/07-effects.js"></script>\n<script src="js/10-persistence.js"></script>')
          p.write_text(s,encoding='utf-8')
          PY
          grep -n 'continueRunBtn\|10-persistence' index.html
          node --check js/10-persistence.js

      - name: Commit wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Wire continue-run UI and persistence module (#5)"
          git push
