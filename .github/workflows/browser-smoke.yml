name: Browser smoke test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Start local game server
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/forbidden-deck-http.log 2>&1 &
          echo $! > /tmp/forbidden-deck-http.pid
          sleep 1

      - name: Run gameplay smoke test
        run: node tests/browser-smoke.mjs

      - name: Run save and continue smoke test
        run: node tests/persistence-smoke.mjs

      - name: Run Act III smoke test
        run: node tests/act3-smoke.mjs

      - name: Run Act III build diversity test
        run: node tests/act3-builds-smoke.mjs

      - name: Run meta history smoke test
        run: node tests/meta-history-smoke.mjs

      - name: Run relationship progression smoke test
        run: node tests/relationship-smoke.mjs

      - name: Run illustrated campfire and save migration smoke test
        run: node tests/relationship-campfire-smoke.mjs

      - name: Run Standard gameplay and act transitions smoke test
        run: node tests/gameplay-standard-smoke.mjs

      - name: Run desktop and narrow relationship layout smoke test
        run: node tests/relationship-layout-smoke.mjs

      - name: Run local file entrypoint smoke test
        run: node tests/offline-check.mjs

      - name: Run self-contained and sandboxed preview smoke test
        run: node tests/preview-smoke.mjs

      - name: Run regional journey and next campfire scene smoke test
        run: node tests/journey-smoke.mjs

      - name: Run living companions and event memories
        run: node tests/companions-smoke.mjs

      - name: Run bilingual world and illustration smoke test
        run: node tests/bilingual-world-smoke.mjs

      - name: Run desktop combat table and large hand test
        run: node tests/combat-table-smoke.mjs

      - name: Run tactical card resource and combo tests
        run: node tests/tactical-cards-smoke.mjs

      - name: Run card artwork and presentation test
        run: node tests/card-art-smoke.mjs

      - name: Run translation coverage audit
        run: node tests/translation-audit.mjs

      - name: Upload playable single-file preview
        uses: actions/upload-artifact@v4
        with:
          name: forbidden-deck-preview
          path: dist/Forbidden-Deck-preview.html
          if-no-files-found: error

      - name: Run combat intent preview smoke test
        run: node tests/intent-preview-smoke.mjs

      - name: Run contextual tutorial smoke test
        run: node tests/tutorial-smoke.mjs
